[package]
name = "glm-user"
version = "2.5.0"
edition = "2021"
authors = ["GLM (Z.ai) — built by the model itself"]
description = "GLM OS userland: freestanding ring-3 programs for GLM OS"

[lib]
name = "glm_user"
path = "src/lib.rs"

[[bin]]
name = "hello"
path = "src/bin/hello.rs"

[[bin]]
name = "fault"
path = "src/bin/fault.rs"

[[bin]]
name = "loop"
path = "src/bin/loop.rs"

[[bin]]
name = "busy"
path = "src/bin/busy.rs"

[dependencies]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
overflow-checks = false

[[bin]]
name = "threadtest"
path = "src/bin/threadtest.rs"

[[bin]]
name = "guidemo"
path = "src/bin/guidemo.rs"

[[bin]]
name = "tcpserv"
path = "src/bin/tcpserv.rs"

[[bin]]
name = "tcpcli"
path = "src/bin/tcpcli.rs"

[[bin]]
name = "counter"
path = "src/bin/counter.rs"

[[bin]]
name = "files"
path = "src/bin/files.rs"

[[bin]]
name = "args"
path = "src/bin/args.rs"

[[bin]]
name = "runit"
path = "src/bin/runit.rs"

[[bin]]
name = "argdump"
path = "src/bin/argdump.rs"

[[bin]]
name = "echo"
path = "src/bin/echo.rs"

[[bin]]
name = "reader"
path = "src/bin/reader.rs"

[[bin]]
name = "upper"
path = "src/bin/upper.rs"

[[bin]]
name = "cat"
path = "src/bin/cat.rs"

[[bin]]
name = "writer"
path = "src/bin/writer.rs"

[[bin]]
name = "sleepy"
path = "src/bin/sleepy.rs"

[[bin]]
name = "tree"
path = "src/bin/tree.rs"

[[bin]]
name = "mktree"
path = "src/bin/mktree.rs"

# v2.4: the wall clock in ring 3 + the OS's own web server
[[bin]]
name = "ntp"
path = "src/bin/ntp.rs"

[[bin]]
name = "httpd"
path = "src/bin/httpd.rs"
